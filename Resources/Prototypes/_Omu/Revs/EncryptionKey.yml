- type: entity
  parent: [ EncryptionKey, BaseMinorContraband ]
  id: EncryptionKeyRevolutionary
  name: Revolutionary encryption key
  description: A homemade radio key.
  components:
  - type: EncryptionKey
    channels:
    - Revolution
    defaultChannel: Revolution
  - type: Sprite
    layers:
    - state: crypt_rusted
    - state: sec_label

- type: entity
  parent: BaseImplantOnlyImplanter
  id: RadioImplanterRevolutionary
  name: Revolutionary radio implanter
  components:
  - type: Implanter
    implant: RadioImplantRevolution

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplantRevolution
  categories: [ HideSpawnMenu ]
  name: Revolutionary radio implant
  description: This implant grants access to the Revolutionary radio channel without a headset, make sure to talk with your brothers in the cause.
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - Revolution
